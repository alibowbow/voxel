<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복셀 마스터피스: 가을 한옥 마을</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: linear-gradient(#ffe3b8 0%, #ffc98f 55%, #e8a05e 100%);
            font-family: 'Noto Sans KR', sans-serif; user-select: none; }
        body::after { content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(60, 25, 5, 0.35) 130%);
            pointer-events: none; z-index: 5; }
        #loader { position: absolute; inset: 0; background: #2a1608; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; color: white;
            transition: opacity 1s ease, visibility 1s ease; }
        .cube-wrapper { perspective: 800px; margin-bottom: 30px; }
        .cube { width: 50px; height: 50px; background: #e8542f;
            animation: flip 1.2s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 24px rgba(232, 84, 47, 0.75); border-radius: 4px; }
        @keyframes flip {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            50% { transform: rotateX(-180.1deg) rotateY(0deg); background: #ffd166; box-shadow: 0 0 24px rgba(255, 209, 102, 0.75); }
            100% { transform: rotateX(-180deg) rotateY(-179.9deg); } }
        #loader h1 { font-weight: 900; letter-spacing: 5px; font-size: 2rem; margin: 0; }
        #loader p { color: #c9a687; font-size: 1rem; margin-top: 10px; }
        #ui { position: absolute; bottom: 40px; left: 40px; background: rgba(42, 22, 8, 0.62);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px 35px; border-radius: 16px; border: 1px solid rgba(255, 235, 200, 0.22);
            color: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 10; pointer-events: none;
            max-width: 420px; opacity: 0; transform: translateY(20px);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .title { font-size: 32px; font-weight: 900; color: #ffd166; letter-spacing: 1.4px; margin-bottom: 5px; line-height: 1.2; }
        .subtitle { font-size: 15px; color: #ff9e6b; font-weight: 700; margin-bottom: 20px; }
        .instructions { font-size: 13.5px; color: #f2e3d0; line-height: 1.8;
            background: rgba(0,0,0,0.26); padding: 12px 15px; border-radius: 8px; }
        .instructions span { color: #fff; font-weight: bold; }
    </style>
    <script type="importmap">
        { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
    </script>
</head>
<body>
    <div id="loader">
        <div class="cube-wrapper"><div class="cube"></div></div>
        <h1>복셀 조각 중...</h1>
        <p>가을빛으로 물든 한옥 마을을 짓고 있습니다</p>
    </div>
    <div id="ui">
        <div class="title">가을 한옥 마을</div>
        <div class="subtitle">기와지붕 · 돌담 · 장독대 · 흩날리는 단풍</div>
        <div class="instructions">
            <span>🖱️ 좌클릭:</span> 카메라 회전<br>
            <span>🖱️ 우클릭:</span> 화면 이동<br>
            <span>🖱️ 스크롤:</span> 화면 확대/축소
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VoxelBuilder, buildVoxelMesh } from './voxel-engine.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffd9a8);
        scene.fog = new THREE.FogExp2(0xffd9a8, 0.0034);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 1200);
        camera.position.set(-72, 52, 88);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.18;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 14, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 240;
        controls.minDistance = 24;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.9;

        // 늦은 오후의 가을 햇살
        scene.add(new THREE.AmbientLight(0xffe8d0, 0.5));
        scene.add(new THREE.HemisphereLight(0xffe0b0, 0x6b4a2a, 0.6));
        const sun = new THREE.DirectionalLight(0xffb066, 2.2);
        sun.position.set(-90, 95, 70);
        sun.castShadow = true;
        sun.shadow.mapSize.set(4096, 4096);
        const d = 120;
        sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
        sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
        sun.shadow.camera.near = 10; sun.shadow.camera.far = 400;
        sun.shadow.bias = -0.0005;
        scene.add(sun);
        const lanternLight = new THREE.PointLight(0xffb04a, 1.2, 55, 2);
        lanternLight.position.set(24, 8, 20);
        scene.add(lanternLight);

        const P = {
            grass: 0x8aa04e, grassDry: 0xb0a45a, dirt: 0x9a7448, path: 0xcabb9a, pathD: 0xb0a184,
            stoneBase: 0x8d8578, stoneDark: 0x6e675c, wallWhite: 0xf2e8d8, wallClay: 0xc9a06a,
            pillar: 0x7a4b28, pillarD: 0x5c3719, hanji: 0xfff6e0, lattice: 0x6b4226,
            tile: 0x3d4148, tileD: 0x2b2e33, ridge: 0xe8e2d4,
            maple: 0xe8542f, mapleD: 0xc23a1c, ginkgo: 0xffd166, ginkgoD: 0xe8b83e,
            trunk: 0x5c3a21, jar: 0x7a4a2e, jarD: 0x60371f, lantern: 0x9a938a, flame: 0xffd166,
        };

        const v = new VoxelBuilder();
        function mulberry32(seed) {
            return function () {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const rng = mulberry32(20261004);

        function buildGround() {
            for (let x = -70; x <= 70; x++) {
                for (let z = -60; z <= 60; z++) {
                    const h = Math.floor(Math.sin(x * 0.05) * 1.2 + Math.cos(z * 0.06) * 1.2 - 1);
                    const onPath = Math.abs(z - Math.round(Math.sin(x * 0.06) * 4)) < 4 && x > -70;
                    let c = onPath ? (rng() > 0.7 ? P.pathD : P.path) : (rng() > 0.6 ? P.grass : P.grassDry);
                    v.add(x, onPath ? h : h, z, c);
                    v.add(x, h - 1, z, P.dirt);
                    if (!onPath && rng() > 0.993) v.add(x, h + 1, z, rng() > 0.5 ? P.maple : P.ginkgo); // 낙엽
                }
            }
        }

        // 기와지붕: x방향 용마루, z방향 경사 + 처마 끝 곡선
        function roof(cx, cy, cz, halfX, halfZ, ridgeH) {
            for (let x = -halfX; x <= halfX; x++) {
                for (let z = -halfZ; z <= halfZ; z++) {
                    const slope = (1 - Math.abs(z) / halfZ) * ridgeH;
                    const curve = Math.max(0, (Math.abs(x) - halfX * 0.55)) * 0.35
                                + Math.max(0, (Math.abs(z) - halfZ * 0.6)) * 0.3;
                    const y = cy + Math.round(slope + curve);
                    v.add(cx + x, y, cz + z, (x + z) % 2 ? P.tile : P.tileD);
                    v.add(cx + x, y - 1, cz + z, P.tileD);
                }
            }
            v.box(cx - halfX, cy + ridgeH, cz - 1, cx + halfX, cy + ridgeH + 1, cz + 1, P.ridge); // 용마루
        }

        function hanok(cx, cz, w, dd, wallH) {
            v.box(cx - w - 2, 0, cz - dd - 2, cx + w + 2, 1, cz + dd + 2, P.stoneBase); // 기단
            v.box(cx - w - 2, 2, cz - dd - 2, cx + w + 2, 2, cz + dd + 2, P.stoneDark);
            for (let px = -w; px <= w; px += Math.max(4, Math.floor(w))) { // 기둥
                v.box(cx + px - 1, 3, cz - dd, cx + px, wallH + 3, cz - dd + 1, P.pillar);
                v.box(cx + px - 1, 3, cz + dd - 1, cx + px, wallH + 3, cz + dd, P.pillar);
            }
            v.box(cx - w, 3, cz - dd + 1, cx + w, wallH + 3, cz + dd - 1, P.wallWhite); // 벽체
            for (let px = -w + 2; px <= w - 2; px += 4) { // 한지 창 + 창살
                v.box(cx + px, 5, cz - dd, cx + px + 2, wallH, cz - dd + 1, P.hanji);
                v.box(cx + px + 1, 5, cz - dd, cx + px + 1, wallH, cz - dd, P.lattice);
                v.box(cx + px, 5, cz + dd - 1, cx + px + 2, wallH, cz + dd, P.hanji);
            }
            roof(cx, wallH + 4, cz, w + 4, dd + 3, 6);
        }

        function tree(x, z, foliage, foliageD, height) {
            const gy = 0;
            for (let i = 0; i < height; i++) {
                v.cylinderY(x + Math.sin(i * 0.25) * 0.8, gy + i, gy + i + 1, z, Math.max(1, 2.4 - i * 0.1), P.trunk);
            }
            const ty = gy + height;
            v.sphere(x, ty + 2, z, 6.5, foliage);
            v.sphere(x + 4, ty, z + 2, 4.5, foliageD);
            v.sphere(x - 4, ty + 1, z - 2, 4.5, foliage);
            v.sphere(x + 1, ty + 6, z - 1, 4, foliageD);
        }

        function stoneWall() {
            for (let x = -46; x <= 46; x++) {
                for (const z of [-34, 34]) {
                    if (Math.abs(x) < 8 && z < 0) continue; // 대문 자리
                    const h = 5 + Math.floor(Math.sin(x * 0.7) * 0.8);
                    for (let y = 0; y <= h; y++) v.add(x, y, z, (x + y) % 2 ? P.stoneBase : P.stoneDark);
                    v.add(x, h + 1, z, P.tileD); // 담장 기와
                }
            }
            for (const x of [-46, 46]) for (let z = -34; z <= 34; z++) {
                const h = 5 + Math.floor(Math.cos(z * 0.7) * 0.8);
                for (let y = 0; y <= h; y++) v.add(x, y, z, (z + y) % 2 ? P.stoneBase : P.stoneDark);
                v.add(x, h + 1, z, P.tileD);
            }
            // 대문
            v.box(-8, 0, -36, -6, 10, -33, P.pillarD);
            v.box(6, 0, -36, 8, 10, -33, P.pillarD);
            roof(0, 11, -34.5, 11, 4, 3);
        }

        function jangdokdae() { // 장독대
            v.box(24, 0, 14, 38, 1, 26, P.stoneDark);
            const jars = [[27, 17, 3], [32, 17, 3.4], [36, 18, 2.6], [29, 22, 3.2], [34, 23, 2.8]];
            for (const [jx, jz, r] of jars) {
                v.cylinderY(jx, 2, 3, jz, r * 0.7, P.jarD);
                v.sphere(jx, 5, jz, r, P.jar);
                v.cylinderY(jx, 8, 8, jz, r * 0.55, P.jarD);
            }
        }

        function stoneLantern() { // 석등
            v.box(23, 0, 19, 25, 1, 21, P.stoneDark);
            v.cylinderY(24, 1, 6, 20, 1, P.lantern);
            v.box(22, 7, 18, 26, 9, 22, P.lantern);
            v.box(23, 8, 19, 25, 8, 21, P.flame);
            v.box(22, 10, 18, 26, 10, 22, P.stoneDark);
            v.add(24, 11, 20, P.stoneDark);
        }

        function farMountains() {
            for (let mx = -100; mx <= 100; mx += 18) {
                const peak = 24 + rng() * 22;
                const bz = -85 + rng() * 8;
                for (let y = -2; y < peak; y++) {
                    const wdt = Math.max(1, Math.floor((peak - y) * 0.5));
                    v.box(mx - wdt, y, bz - 3, mx + wdt, y, bz + 3, y > peak - 5 ? 0xc98a5a : 0x8a5f3e);
                }
            }
        }

        buildGround();
        hanok(-14, 4, 14, 9, 8);
        hanok(22, -16, 8, 6, 6);
        stoneWall();
        tree(-36, 20, P.maple, P.mapleD, 12);
        tree(38, 8, P.ginkgo, P.ginkgoD, 14);
        tree(-30, -24, P.ginkgo, P.ginkgoD, 10);
        jangdokdae();
        stoneLantern();
        farMountains();

        // 흩날리는 단풍잎 (애니메이션)
        const leafGroup = new THREE.Group();
        scene.add(leafGroup);
        const leafGeo = new THREE.BoxGeometry(1, 0.2, 1);
        const leafMats = [new THREE.MeshStandardMaterial({ color: P.maple }),
                          new THREE.MeshStandardMaterial({ color: P.ginkgo }),
                          new THREE.MeshStandardMaterial({ color: P.mapleD })];
        const leaves = [];
        for (let i = 0; i < 40; i++) {
            const m = new THREE.Mesh(leafGeo, leafMats[i % 3]);
            m.userData = { x: -50 + rng() * 100, z: -40 + rng() * 80,
                speed: 2.2 + rng() * 2.4, sway: 2 + rng() * 3, phase: rng() * Math.PI * 2, top: 26 + rng() * 14 };
            leafGroup.add(m);
            leaves.push(m);
        }

        scene.add(buildVoxelMesh(THREE, v, { size: 0.95, roughness: 0.85, metalness: 0.05 }));
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
        }, 200);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            for (const leaf of leaves) {
                const u = leaf.userData;
                const cycle = (t * u.speed / u.top + u.phase) % 1;
                leaf.position.set(
                    u.x + Math.sin(t * 1.3 + u.phase) * u.sway,
                    u.top * (1 - cycle),
                    u.z + Math.cos(t * 0.9 + u.phase) * u.sway);
                leaf.rotation.set(t * 2 + u.phase, t * 1.4, u.phase);
            }
            lanternLight.intensity = 1.05 + Math.sin(t * 6.2) * 0.18;
            controls.target.y = 14 + Math.sin(t * 1.1) * 1.1;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
