<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복셀 마스터피스: 화산 섬</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: linear-gradient(#2a1420 0%, #6e2a2a 55%, #c25a2d 100%);
            font-family: 'Noto Sans KR', sans-serif; user-select: none; }
        body::after { content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(20, 4, 8, 0.55) 130%);
            pointer-events: none; z-index: 5; }
        #loader { position: absolute; inset: 0; background: #1a0b12; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; color: white;
            transition: opacity 1s ease, visibility 1s ease; }
        .cube-wrapper { perspective: 800px; margin-bottom: 30px; }
        .cube { width: 50px; height: 50px; background: #ff6b2d;
            animation: flip 1.2s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 24px rgba(255, 107, 45, 0.75); border-radius: 4px; }
        @keyframes flip {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            50% { transform: rotateX(-180.1deg) rotateY(0deg); background: #ffd23c; box-shadow: 0 0 24px rgba(255, 210, 60, 0.75); }
            100% { transform: rotateX(-180deg) rotateY(-179.9deg); } }
        #loader h1 { font-weight: 900; letter-spacing: 5px; font-size: 2rem; margin: 0; }
        #loader p { color: #cc8a72; font-size: 1rem; margin-top: 10px; }
        #ui { position: absolute; bottom: 40px; left: 40px; background: rgba(26, 10, 14, 0.62);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px 35px; border-radius: 16px; border: 1px solid rgba(255, 190, 150, 0.22);
            color: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.42); z-index: 10; pointer-events: none;
            max-width: 420px; opacity: 0; transform: translateY(20px);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .title { font-size: 32px; font-weight: 900; color: #ff8a4d; letter-spacing: 1.4px; margin-bottom: 5px; line-height: 1.2; }
        .subtitle { font-size: 15px; color: #ffcf8a; font-weight: 700; margin-bottom: 20px; }
        .instructions { font-size: 13.5px; color: #f2ddd2; line-height: 1.8;
            background: rgba(0,0,0,0.26); padding: 12px 15px; border-radius: 8px; }
        .instructions span { color: #fff; font-weight: bold; }
    </style>
    <script type="importmap">
        { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
    </script>
</head>
<body>
    <div id="loader">
        <div class="cube-wrapper"><div class="cube"></div></div>
        <h1>복셀 조각 중...</h1>
        <p>어스름한 바다 위로 용암이 끓는 화산섬을 빚고 있습니다</p>
    </div>
    <div id="ui">
        <div class="title">화산 섬</div>
        <div class="subtitle">용암 분수 · 연기 기둥 · 검은 모래 해변 · 야자수</div>
        <div class="instructions">
            <span>🖱️ 좌클릭:</span> 카메라 회전<br>
            <span>🖱️ 우클릭:</span> 화면 이동<br>
            <span>🖱️ 스크롤:</span> 화면 확대/축소
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VoxelBuilder, buildVoxelMesh } from './voxel-engine.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2b1119);
        scene.fog = new THREE.FogExp2(0x40191b, 0.0032);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 1200);
        camera.position.set(-78, 52, 96);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 22, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 260;
        controls.minDistance = 26;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.7;

        // 어스름한 붉은 하늘 + 분화구의 불빛
        scene.add(new THREE.AmbientLight(0x74404a, 0.6));
        scene.add(new THREE.HemisphereLight(0xc25a3a, 0x140c10, 0.65));
        const duskSun = new THREE.DirectionalLight(0xff9a5a, 1.0);
        duskSun.position.set(70, 55, -85);
        duskSun.castShadow = true;
        duskSun.shadow.mapSize.set(4096, 4096);
        const d = 120;
        duskSun.shadow.camera.left = -d; duskSun.shadow.camera.right = d;
        duskSun.shadow.camera.top = d; duskSun.shadow.camera.bottom = -d;
        duskSun.shadow.camera.near = 10; duskSun.shadow.camera.far = 400;
        duskSun.shadow.bias = -0.0005;
        scene.add(duskSun);
        const craterLight = new THREE.PointLight(0xff6b2d, 3.0, 130, 2);
        craterLight.position.set(0, 46, -4);
        scene.add(craterLight);
        const shoreLava = new THREE.PointLight(0xff4a1f, 1.3, 42, 2);
        shoreLava.position.set(36, 5, 10);
        scene.add(shoreLava);

        const P = {
            rock: 0x453338, rockD: 0x2e2226, rockL: 0x5a4344, rim: 0x241a1e,
            lavaB: 0xffd23c, lava: 0xff6b2d, lavaD: 0xd63c14, ember: 0xff3d00,
            sand: 0x1e1a1f, sandL: 0x2b242b, sandW: 0x35303a, pebble: 0x4a4046,
            deep: 0x0e2733, water: 0x16404d, waterL: 0x1e5666, foam: 0xd9b3a0,
            trunk: 0x6e4a2a, trunkD: 0x54361c, frond: 0x2e7d4f, frondD: 0x1f5c3a, jungle: 0x2a6644,
            sun: 0xff7a4a, sunCore: 0xffb27a, far: 0x2a1520, star: 0xffc9b0,
        };

        const v = new VoxelBuilder();
        function mulberry32(seed) {
            return function () {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const rng = mulberry32(20260707);

        const CX = 0, CZ = -4; // 화산 중심
        const STREAM_ANGLES = [0.4, 2.4, 4.5]; // 용암 줄기 방향

        function coneH(dd) {
            if (dd >= 32) return dd > 40 ? 1 : 2;
            const t = Math.min(1, (32 - dd) / 26);
            return 2 + Math.round(40 * Math.pow(t, 1.55));
        }
        function angDist(a, b) {
            let x = Math.abs(a - b) % (Math.PI * 2);
            return x > Math.PI ? Math.PI * 2 - x : x;
        }
        function nearStream(a) {
            return STREAM_ANGLES.some(s => angDist(a, s) < 0.4);
        }

        function islandAndSea() {
            for (let x = -70; x <= 70; x++) {
                for (let z = -60; z <= 60; z++) {
                    const dx = x - CX, dz = (z - CZ) * 1.08;
                    const dd = Math.hypot(dx, dz);
                    const a = Math.atan2(dz, dx);
                    const shore = 44 + Math.sin(a * 4.7) * 2 + Math.sin(a * 9.3) * 1.2;
                    if (dd > shore) { // 바다
                        const w = rng();
                        let c = w > 0.93 ? P.waterL : (w > 0.55 ? P.water : P.deep);
                        if (dd < shore + 2.5 && rng() > 0.35) c = P.foam; // 해안 포말
                        v.add(x, 0, z, c);
                        continue;
                    }
                    if (dd < 4.5) { // 분화구 내부: 끓는 용암 호수
                        const w = rng();
                        v.add(x, 38, z, w > 0.6 ? P.lavaB : (w > 0.25 ? P.lava : P.lavaD));
                        v.add(x, 37, z, P.lavaD);
                        continue;
                    }
                    if (dd < 6.5) { // 분화구 테두리
                        const h = 42 + (rng() > 0.62 ? 1 : 0);
                        for (let y = 37; y <= h; y++) v.add(x, y, z, y === h ? P.rim : P.rockD);
                        if (rng() > 0.55) v.add(x, 42, z, P.ember); // 달아오른 테두리
                        continue;
                    }
                    const h = coneH(dd);
                    if (dd >= 32) { // 검은 모래 해변
                        for (let y = 0; y <= h; y++) {
                            let c = rng() > 0.6 ? P.sandL : P.sand;
                            if (dd > shore - 3.5) c = P.sandW; // 젖은 모래
                            if (y === h && rng() > 0.985) c = P.pebble;
                            v.add(x, y, z, c);
                        }
                        continue;
                    }
                    // 화산 사면
                    for (let y = Math.max(0, h - 3); y <= h; y++) {
                        let c = rng() > 0.5 ? P.rock : P.rockD;
                        if (y === h) {
                            if (h > 30 && rng() > 0.955) c = P.ember; // 상부의 잔불
                            else if (rng() > 0.86) c = P.rockL;
                            // 하부 사면의 열대 수풀 (용암 줄기 방향은 피함)
                            if (dd > 27 && !nearStream(a) && rng() > 0.5)
                                c = rng() > 0.5 ? P.jungle : P.frondD;
                        }
                        v.add(x, y, z, c);
                    }
                }
            }
        }

        function lavaStream(a0, len, wiggle) {
            const steps = 64;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const dd = 5.5 + t * len;
                const a = a0 + Math.sin(t * 6.3) * wiggle;
                const x = CX + Math.cos(a) * dd;
                const z = CZ + Math.sin(a) * dd / 1.08;
                const y = coneH(dd);
                const r = t < 0.15 ? 1.7 : 1.2;
                const c = i % 3 === 0 ? P.lavaB : (i % 3 === 1 ? P.lava : P.lavaD);
                v.sphere(Math.round(x), y, Math.round(z), r, c);
                v.add(Math.round(x), y + 1, Math.round(z), i % 2 ? P.lava : P.lavaB); // 빛나는 중심선
                if (rng() > 0.72) v.add(Math.round(x + (rng() * 4 - 2)), y, Math.round(z + (rng() * 4 - 2)), P.ember);
            }
            // 해변에 퍼진 용암 삼각주
            const ea = a0 + Math.sin(6.3) * wiggle;
            const ex = Math.round(CX + Math.cos(ea) * (5.5 + len));
            const ez = Math.round(CZ + Math.sin(ea) * (5.5 + len) / 1.08);
            v.ellipsoid(ex, 1, ez, 4, 1, 3, P.lava);
            v.ellipsoid(ex, 2, ez, 2, 1, 2, P.lavaB);
        }

        function palm(bx, bz, h, dx, dz) {
            const mx = bx + dx * 0.35, my = 1 + h * 0.55, mz = bz + dz * 0.35;
            const tx = bx + dx, ty = 1 + h, tz = bz + dz;
            v.line(bx, 1, bz, mx, my, mz, 0.6, P.trunk);
            v.line(mx, my, mz, tx, ty, tz, 0.6, P.trunkD);
            for (let k = 0; k < 8; k++) {
                const a = k * Math.PI / 4 + 0.35;
                const fx = Math.cos(a) * 6.5, fz = Math.sin(a) * 6.5;
                const c = k % 2 ? P.frond : P.frondD;
                v.line(tx, ty, tz, tx + fx * 0.55, ty + 2, tz + fz * 0.55, 0.5, c);
                v.line(tx + fx * 0.55, ty + 2, tz + fz * 0.55, tx + fx, ty - 1, tz + fz, 0.5, c);
            }
            v.add(tx + 1, ty, tz + 1, 0x4a3018); // 코코넛
            v.add(tx - 1, ty, tz, 0x54361c);
        }

        function shrub(x, z, r) {
            v.ellipsoid(x, 2, z, r, Math.max(1, r - 1), r, rng() > 0.5 ? P.jungle : P.frondD);
            v.ellipsoid(x + 1, 3, z - 1, r - 1, 1, r - 1, P.frond);
        }

        function skyDeco() {
            // 수평선 너머로 가라앉는 붉은 태양
            v.sphere(48, 30, -53, 6, P.sun);
            v.sphere(46, 32, -52, 3, P.sunCore);
            // 원경의 화산섬 실루엣
            for (const [mx, peak, r] of [[-58, 20, 9], [-38, 13, 6], [58, 16, 8], [30, 10, 5]]) {
                for (let y = 0; y < peak; y++) {
                    const w = Math.max(1, Math.round(r * (1 - y / peak)));
                    v.box(mx - w, y, -58, mx + w, y, -53, P.far);
                }
            }
            // 붉게 물든 별
            for (let i = 0; i < 40; i++) {
                v.add(Math.round(-70 + rng() * 140), Math.round(62 + rng() * 44), -59 + Math.round(rng() * 2), P.star);
            }
        }

        islandAndSea();
        lavaStream(STREAM_ANGLES[0], 34, 0.18);
        lavaStream(STREAM_ANGLES[1], 28, 0.22);
        lavaStream(STREAM_ANGLES[2], 31, 0.15);
        palm(-34, 8, 12, 4, 2); palm(-14, 30, 10, -2, 3); palm(10, 30, 13, 3, 3);
        palm(30, -16, 11, 3, -2); palm(-30, -20, 9, -3, -2); palm(18, 26, 8, -2, 2);
        shrub(-38, 2, 3); shrub(-20, 27, 2); shrub(14, 34, 3); shrub(34, -10, 2);
        shrub(-26, -24, 3); shrub(24, 22, 2); shrub(-8, 34, 2);
        skyDeco();

        // 용암 분수 (포물선 파티클)
        const lavaGroup = new THREE.Group();
        scene.add(lavaGroup);
        const bombGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
        const bombMats = [
            new THREE.MeshBasicMaterial({ color: 0xffd23c }),
            new THREE.MeshBasicMaterial({ color: 0xff8a3c }),
            new THREE.MeshBasicMaterial({ color: 0xff5a1f }),
        ];
        const bombs = [];
        const G = 20;
        for (let i = 0; i < 46; i++) {
            const m = new THREE.Mesh(bombGeo, bombMats[i % 3]);
            const vy = 13 + rng() * 8;
            const ang = rng() * Math.PI * 2;
            const vh = 1.5 + rng() * 4;
            m.userData = {
                vy, vx: Math.cos(ang) * vh, vz: Math.sin(ang) * vh,
                dur: (vy + Math.sqrt(vy * vy + 2 * G * 12)) / G,
                phase: rng(), spin: 2 + rng() * 5,
            };
            lavaGroup.add(m);
            bombs.push(m);
        }

        // 연기 기둥 (상승·확산·소멸)
        const smokeGroup = new THREE.Group();
        scene.add(smokeGroup);
        const smokeGeo = new THREE.SphereGeometry(1, 7, 6);
        const puffs = [];
        for (let i = 0; i < 26; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: i % 3 ? 0x4a3a40 : 0x6b565c, transparent: true, opacity: 0, depthWrite: false,
            });
            const m = new THREE.Mesh(smokeGeo, mat);
            m.userData = {
                phase: i / 26, speed: 7 + rng() * 4,
                swayA: 1.5 + rng() * 2.5, swayP: rng() * Math.PI * 2,
                ox: rng() * 4 - 2, oz: rng() * 4 - 2,
            };
            smokeGroup.add(m);
            puffs.push(m);
        }

        scene.add(buildVoxelMesh(THREE, v, { size: 0.95, roughness: 0.9, metalness: 0.04 }));
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
        }, 200);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            for (const b of bombs) { // 용암 파편 포물선
                const u = b.userData;
                const cyc = (t / u.dur + u.phase) % 1;
                const tau = cyc * u.dur;
                b.position.set(
                    CX + u.vx * tau,
                    40 + u.vy * tau - 0.5 * G * tau * tau,
                    CZ + u.vz * tau);
                const s = 1 - cyc * 0.65;
                b.scale.setScalar(Math.max(0.05, s));
                b.rotation.set(tau * u.spin, tau * u.spin * 0.7, 0);
            }

            const RISE = 52, CYCLE = 7;
            for (const p of puffs) { // 연기 기둥
                const u = p.userData;
                const cyc = (t / CYCLE + u.phase) % 1;
                p.position.set(
                    CX + u.ox + Math.sin(t * 0.6 + u.swayP) * u.swayA + cyc * cyc * 10, // 바람에 밀림
                    45 + cyc * RISE,
                    CZ + u.oz + Math.cos(t * 0.5 + u.swayP) * u.swayA * 0.7);
                p.scale.setScalar(1.6 + cyc * 5.5);
                p.material.opacity = 0.4 * (1 - cyc) * Math.min(1, cyc * 9);
            }

            // 분화구 글로우 맥동
            craterLight.intensity = 2.6 + Math.sin(t * 3.2) * 0.7 + Math.sin(t * 9.1) * 0.35;
            shoreLava.intensity = 1.1 + Math.sin(t * 4.6 + 1.3) * 0.35;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
