<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복셀 마스터피스: 천공의 세계수</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle at 62% 32%, #3a2a66 0%, #241a4a 40%, #140d30 78%, #0a0720 100%);
            font-family: 'Noto Sans KR', sans-serif; user-select: none; }
        body::after { content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 38%, rgba(6, 4, 20, 0.55) 130%);
            pointer-events: none; z-index: 5; }
        #loader { position: absolute; inset: 0; background: #120c2c; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; color: white;
            transition: opacity 1.1s ease, visibility 1.1s ease; }
        .cube-wrapper { perspective: 800px; margin-bottom: 30px; }
        .cube { width: 50px; height: 50px; background: #8fe8c8;
            animation: flip 1.2s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 26px rgba(143, 232, 200, 0.8); border-radius: 4px; }
        @keyframes flip {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            50% { transform: rotateX(-180.1deg) rotateY(0deg); background: #ffd66b; box-shadow: 0 0 26px rgba(255, 214, 107, 0.85); }
            100% { transform: rotateX(-180deg) rotateY(-179.9deg); } }
        #loader h1 { font-weight: 900; letter-spacing: 5px; font-size: 2rem; margin: 0; }
        #loader p { color: #9a8fce; font-size: 1rem; margin-top: 10px; }
        #ui { position: absolute; bottom: 40px; left: 40px; background: rgba(18, 12, 44, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px 35px; border-radius: 16px; border: 1px solid rgba(200, 190, 255, 0.22);
            color: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.45); z-index: 10; pointer-events: none;
            max-width: 440px; opacity: 0; transform: translateY(20px);
            animation: slideUp 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.3s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .title { font-size: 32px; font-weight: 900; color: #8fe8c8; letter-spacing: 1.4px; margin-bottom: 5px; line-height: 1.2; }
        .subtitle { font-size: 15px; color: #ffd66b; font-weight: 700; margin-bottom: 20px; }
        .instructions { font-size: 13.5px; color: #e6e0f5; line-height: 1.8;
            background: rgba(0,0,0,0.28); padding: 12px 15px; border-radius: 8px; }
        .instructions span { color: #fff; font-weight: bold; }
    </style>
    <script type="importmap">
        { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
    </script>
</head>
<body>
    <div id="loader">
        <div class="cube-wrapper"><div class="cube"></div></div>
        <h1>복셀 조각 중...</h1>
        <p>황혼의 하늘에 세계수를 심고 있습니다</p>
    </div>
    <div id="ui">
        <div class="title">천공의 세계수</div>
        <div class="subtitle">부유섬 · 빛나는 수관 · 폭포 · 반딧불이 · 토리이</div>
        <div class="instructions">
            <span>🖱️ 좌클릭:</span> 카메라 회전<br>
            <span>🖱️ 우클릭:</span> 화면 이동<br>
            <span>🖱️ 스크롤:</span> 화면 확대/축소
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VoxelBuilder, buildVoxelMesh } from './voxel-engine.js';

        // ==========================================
        // 1. 씬 · 렌더러 · 카메라 · 조명 (황혼)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x171038);
        scene.fog = new THREE.FogExp2(0x1b1240, 0.0052);

        const camera = new THREE.PerspectiveCamera(41, window.innerWidth / window.innerHeight, 1, 1400);
        camera.position.set(-70, 40, 92);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 24, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 260;
        controls.minDistance = 30;
        controls.maxPolarAngle = Math.PI * 0.62;   // 섬 밑동·폭포·뿌리까지 살짝 올려다볼 수 있게
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.62;

        scene.add(new THREE.AmbientLight(0x6a5f9e, 0.68));
        scene.add(new THREE.HemisphereLight(0x9a8ae0, 0x2a1f44, 0.82));
        const moon = new THREE.DirectionalLight(0xdcd0ff, 1.5);
        moon.position.set(-60, 96, 74);
        moon.castShadow = true;
        moon.shadow.mapSize.set(4096, 4096);
        const d = 100;
        moon.shadow.camera.left = -d; moon.shadow.camera.right = d;
        moon.shadow.camera.top = d; moon.shadow.camera.bottom = -d;
        moon.shadow.camera.near = 10; moon.shadow.camera.far = 420;
        moon.shadow.bias = -0.0005;
        scene.add(moon);
        // 수관 속에서 은은히 맥동하는 마법 빛
        const canopyLight = new THREE.PointLight(0x7fffd0, 1.7, 120, 2);
        canopyLight.position.set(0, 42, 0);
        scene.add(canopyLight);
        const goldLight = new THREE.PointLight(0xffd47a, 1.2, 90, 2);
        goldLight.position.set(6, 34, 8);
        scene.add(goldLight);

        // 결정론적 난수
        function mulberry32(seed) {
            return function () {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const rng = mulberry32(20260923);

        // ==========================================
        // 2. 팔레트
        // ==========================================
        const P = {
            soil: 0x4a3728, soilD: 0x38291d, soilL: 0x5c4632,
            grass: 0x4c7d5b, grassL: 0x64a074, grassMoss: 0x3d6a52,
            bark: 0x6b4a30, barkD: 0x4c3420, barkL: 0x866040,
            root: 0x5a4130, rootD: 0x3d2b1e,
            leaf: 0x2f8570, leafD: 0x24685a, leafL: 0x49ac90, leafDeep: 0x1c5346,
            gold: 0xffd873, pink: 0xff9ecb, cyan: 0x8fe8ff, lime: 0xbdf5a0,
            water: 0x8fdcee, waterD: 0x5fb8d8, foam: 0xeafcff,
            paper: 0xffbe66, paperGlow: 0xffe4a8, cord: 0x2e2016,
            stone: 0x8f8a7c, stoneD: 0x6d685b, stoneL: 0xa8a394,
            torii: 0xdd4f3b, toriiD: 0xb23829,
            crystal: 0x9d7dff, crystalL: 0xcbb8ff,
            flowerP: 0xff8fc0, flowerY: 0xffe07a, flowerW: 0xf4eeff,
        };
        const rc = (a, b) => (rng() < 0.5 ? a : b);

        // ==========================================
        // 3. 정적 월드 빌드 (섬 + 세계수 + 구조물)
        // ==========================================
        const v = new VoxelBuilder();

        // --- 3a. 부유섬 (눈물방울 원뿔) ---
        const TOP = 8, TIP = -19, R = 17;
        function island() {
            for (let y = TOP; y >= TIP; y--) {
                const t = (TOP - y) / (TOP - TIP);          // 0(위) → 1(끝)
                const r = R * Math.pow(1 - t, 0.72) + (y === TOP ? 0.4 : 0);
                if (r < 0.6) { v.add(0, y, 0, P.soilD); continue; }
                const rr = r * r, b = Math.ceil(r);
                for (let x = -b; x <= b; x++)
                for (let z = -b; z <= b; z++) {
                    const dd = x * x + z * z;
                    if (dd > rr) continue;
                    const edge = dd > (r - 1.4) * (r - 1.4);
                    let c;
                    if (y === TOP) c = (rng() < 0.16) ? P.grassMoss : (rng() < 0.3 ? P.grassL : P.grass);
                    else if (y >= TOP - 2) c = edge ? P.soilL : P.soil;
                    else if (t > 0.62 && rng() < 0.12) c = P.crystal;   // 밑동에 박힌 수정
                    else c = rc(P.soil, P.soilD);
                    v.add(x, y, z, c);
                }
            }
            // 수정 원석 클러스터 (섬 밑동)
            for (const [cx, cy, cz] of [[4, -12, -3], [-6, -14, 2], [2, -16, 5], [-3, -10, -6]]) {
                v.sphere(cx, cy, cz, 1.6 + rng(), P.crystal);
                v.add(cx, cy + 2, cz, P.crystalL);
            }
        }

        // --- 3b. 섬을 감싸는 뿌리 ---
        function wrappingRoots() {
            for (let i = 0; i < 9; i++) {
                const a = (i / 9) * Math.PI * 2 + 0.3;
                const sx = Math.cos(a) * 4, sz = Math.sin(a) * 4;
                const ex = Math.cos(a) * (R - 2), ez = Math.sin(a) * (R - 2);
                // 밑동에서 섬 가장자리로 퍼진 뒤 원뿔 표면을 타고 흘러내림
                v.line(sx, 8, sz, ex, 7, ez, 1.1, P.root);
                v.line(ex, 7, ez, Math.cos(a) * 6, -8, Math.sin(a) * 6, 1.0, rc(P.root, P.rootD));
                v.line(Math.cos(a) * 6, -8, Math.sin(a) * 6, Math.cos(a) * 1.5, TIP + 2, Math.sin(a) * 1.5, 0.8, P.rootD);
            }
            // 끝에서 늘어진 잔뿌리
            for (let i = 0; i < 6; i++) {
                const a = rng() * Math.PI * 2, rr = rng() * 3;
                v.line(Math.cos(a) * rr, TIP + 3, Math.sin(a) * rr, Math.cos(a) * (rr + 1), TIP - 6 - rng() * 5, Math.sin(a) * (rr + 1), 0.5, P.rootD);
            }
        }

        // --- 3c. 세계수 (몸통 + 버팀뿌리 + 가지) ---
        const canopyAnchors = [];
        function worldTree() {
            const H = 44;
            let px = 0, pz = 0;
            for (let y = 9; y <= H; y++) {
                const t = (y - 9) / (H - 9);
                px = Math.sin(t * 2.4) * 2.2;               // 완만한 S자 곡선
                pz = Math.cos(t * 1.7) * 1.4;
                const r = 4.3 * (1 - t) + 1.5;
                v.cylinderY(px, y, y, pz, r, rng() < 0.28 ? P.barkD : P.bark);
                if (rng() < 0.4) v.add(Math.round(px + r - 0.5), y, Math.round(pz), P.barkL);   // 세로 결
                if (rng() < 0.4) v.add(Math.round(px - r + 0.5), y, Math.round(pz), P.barkD);
            }
            // 버팀뿌리 (밑동에서 잔디 위로 퍼짐)
            for (let i = 0; i < 7; i++) {
                const a = (i / 7) * Math.PI * 2;
                v.line(0, 10, 0, Math.cos(a) * 9, 8, Math.sin(a) * 9, 1.4, rc(P.bark, P.barkD));
                v.line(Math.cos(a) * 6, 9, Math.sin(a) * 6, Math.cos(a) * 12, 8, Math.sin(a) * 12, 0.9, P.root);
            }
            // 큰 가지 → 수관 앵커
            const branches = [
                [10, 40, 6, 12], [-11, 39, -5, 12], [4, 43, -12, 11], [-6, 42, 11, 11],
                [13, 36, -6, 9], [-13, 37, 5, 9], [0, 47, 0, 10], [7, 45, 8, 8], [-8, 45, -7, 8],
            ];
            for (const [bx, by, bz, r] of branches) {
                v.line(px, 34, pz, bx * 0.55, 37, bz * 0.55, 1.2, P.bark);
                v.line(bx * 0.55, 37, bz * 0.55, bx, by, bz, 0.8, P.barkD);
                canopyAnchors.push([bx, by, bz, r]);
            }
            canopyAnchors.push([0, 40, 0, 12]);   // 중심 큰 덩어리
        }

        // --- 3d. 수관 (겹친 잎 덩어리 + 빛나는 잎 흩뿌리기) ---
        function canopy() {
            for (const [cx, cy, cz, r] of canopyAnchors) {
                v.sphere(cx, cy, cz, r, P.leaf);
                v.sphere(cx + 2, cy - 1, cz + 1, r * 0.7, P.leafD);
                v.sphere(cx - 2, cy + 1, cz - 1, r * 0.6, P.leafDeep);
                v.sphere(cx + 1, cy + 2, cz + 1, r * 0.55, P.leafL);
            }
            // 표면 잎을 스캔해 일부를 빛나는 잎/꽃으로 치환 (마법 반짝임)
            const entries = [...v.voxels.entries()];
            for (const [k, c] of entries) {
                if (c !== P.leaf && c !== P.leafL && c !== P.leafD) continue;
                const [x, y, z] = k.split(',').map(Number);
                if (y < 30) continue;
                const rv = rng();
                if (rv < 0.020) v.add(x, y, z, P.gold);
                else if (rv < 0.034) v.add(x, y, z, P.pink);
                else if (rv < 0.045) v.add(x, y, z, P.cyan);
                else if (rv < 0.052) v.add(x, y, z, P.lime);
            }
        }

        // --- 3e. 폭포 (정적 물줄기 + 상단 물거품) ---
        const falls = [[-13, 8, 5], [12, 8, -9]];
        function waterfalls() {
            for (const [lx, ly, lz] of falls) {
                const len = Math.hypot(lx, lz);
                const ux = lx / len, uz = lz / len;
                v.sphere(lx, ly, lz, 2, P.foam);                       // 상단 물거품
                for (let y = ly; y >= -30; y--) {
                    const depth = ly - y;
                    const ox = lx + ux * depth * 0.14;
                    const oz = lz + uz * depth * 0.14;
                    const wob = Math.sin(depth * 0.5) * 0.8;
                    v.box(Math.round(ox - 1), y, Math.round(oz), Math.round(ox + 1), y, Math.round(oz), rc(P.water, P.waterD));
                    v.add(Math.round(ox + wob), y, Math.round(oz - uz), P.foam);
                }
            }
        }

        // --- 3f. 토리이 · 돌길 · 석등 ---
        function shrine() {
            // 붉은 토리이 (섬 앞쪽 가장자리)
            const tz = 12;
            v.box(-5, 8, tz, -4, 20, tz, P.torii);
            v.box(4, 8, tz, 5, 20, tz, P.torii);
            v.box(-7, 21, tz, 7, 22, tz, P.toriiD);      // 상단 가사기
            v.box(-6, 19, tz, 6, 19, tz, P.torii);       // 누키
            v.add(0, 20, tz, P.toriiD);
            // 돌길: 토리이 → 밑동
            for (let s = 0; s <= 10; s++) {
                const zz = tz - s;
                v.box(-1, 9, zz, 1, 9, zz, s % 2 ? P.stone : P.stoneL);
            }
            // 석등
            v.box(9, 9, 6, 10, 10, 7, P.stoneD);
            v.cylinderY(9.5, 10, 12, 6.5, 1, P.stone);
            v.box(8, 12, 5, 11, 13, 8, P.stoneL);
            v.add(9, 12, 6, P.paperGlow); v.add(10, 12, 7, P.paperGlow);
            v.box(8, 14, 5, 11, 14, 8, P.stoneD);
            // 잔디 위 꽃/이끼 디테일
            for (let i = 0; i < 40; i++) {
                const a = rng() * Math.PI * 2, rr = rng() * (R - 2);
                const fx = Math.round(Math.cos(a) * rr), fz = Math.round(Math.sin(a) * rr);
                if (fx * fx + fz * fz > (R - 1) * (R - 1)) continue;
                const roll = rng();
                v.add(fx, 9, fz, roll < 0.4 ? P.flowerP : roll < 0.7 ? P.flowerY : roll < 0.85 ? P.flowerW : P.grassL);
            }
            // 작은 돌 무더기
            for (const [sx, sz] of [[-9, -6], [6, -10], [-4, 8]]) {
                v.sphere(sx, 9, sz, 1.3, rc(P.stone, P.stoneD));
            }
        }

        island();
        wrappingRoots();
        worldTree();
        canopy();
        waterfalls();
        shrine();

        scene.add(buildVoxelMesh(THREE, v, { size: 0.96, roughness: 0.86, metalness: 0.05 }));

        // ==========================================
        // 4. 떠 있는 작은 섬들 (부드럽게 흔들림)
        // ==========================================
        function makeIslet(radius, treeH, lanternHex) {
            const iv = new VoxelBuilder();
            for (let y = 0; y >= -Math.round(radius * 1.4); y--) {
                const t = -y / (radius * 1.4);
                const r = radius * Math.pow(1 - t, 0.7);
                if (r < 0.5) { iv.add(0, y, 0, P.soilD); continue; }
                const rr = r * r, b = Math.ceil(r);
                for (let x = -b; x <= b; x++) for (let z = -b; z <= b; z++)
                    if (x * x + z * z <= rr) iv.add(x, y, z, y === 0 ? rc(P.grass, P.grassL) : rc(P.soil, P.soilD));
            }
            // 작은 나무 또는 등불 기둥
            iv.box(0, 1, 0, 0, treeH, 0, P.bark);
            iv.sphere(0, treeH + 1, 0, radius * 0.55, P.leaf);
            iv.sphere(1, treeH, 1, radius * 0.4, P.leafD);
            iv.add(0, treeH + 2, 0, P.gold);
            // 매달린 등불
            iv.line(2, treeH, 0, 2, treeH - 3, 0, 0.4, P.cord);
            iv.box(1, treeH - 5, -1, 3, treeH - 3, 1, lanternHex);
            const mesh = buildVoxelMesh(THREE, iv, { size: 0.9, roughness: 0.85, metalness: 0.05 });
            const g = new THREE.Group();
            g.add(mesh);
            scene.add(g);
            return g;
        }
        const islets = [
            { g: makeIslet(6, 8, P.paper), base: new THREE.Vector3(-40, 16, -18), amp: 2.2, sp: 0.5, ph: 0 },
            { g: makeIslet(4.5, 6, P.pink), base: new THREE.Vector3(38, 30, 20), amp: 2.6, sp: 0.62, ph: 1.7 },
            { g: makeIslet(5, 7, P.cyan), base: new THREE.Vector3(30, 8, -34), amp: 1.9, sp: 0.44, ph: 3.1 },
            { g: makeIslet(3.5, 5, P.gold), base: new THREE.Vector3(-34, 44, 24), amp: 2.4, sp: 0.7, ph: 4.4 },
        ];
        for (const it of islets) it.g.position.copy(it.base);

        // ==========================================
        // 5. 하늘: 달 · 별 · 성운 티끌
        // ==========================================
        const moonMesh = new THREE.Mesh(
            new THREE.SphereGeometry(11, 24, 24),
            new THREE.MeshBasicMaterial({ color: 0xfff3d6 }));
        moonMesh.position.set(-96, 104, -120);
        scene.add(moonMesh);
        const moonHalo = new THREE.Mesh(
            new THREE.SphereGeometry(17, 20, 20),
            new THREE.MeshBasicMaterial({ color: 0xfff0c8, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false }));
        moonHalo.position.copy(moonMesh.position);
        scene.add(moonHalo);

        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < 900; i++) {
            const a = rng() * Math.PI * 2, b = Math.acos(rng() * 2 - 1), rr = 300 + rng() * 260;
            starPos.push(Math.sin(b) * Math.cos(a) * rr, Math.abs(Math.cos(b)) * rr * 0.9 - 40, Math.sin(b) * Math.sin(a) * rr);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xf2ecff, size: 1.7, sizeAttenuation: true, transparent: true, opacity: 0.9 }));
        scene.add(stars);

        // ==========================================
        // 6. 애니메이션 요소 (반딧불이 · 낙엽 · 물방울 · 안개 · 등불 후광)
        // ==========================================
        // 반딧불이 (수관을 맴도는 빛)
        const fireflies = [];
        const fGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
        const fColors = [0xffe08a, 0xbdf5a0, 0x8fe8ff, 0xff9ecb];
        const fMats = fColors.map(c => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
        const fireflyGroup = new THREE.Group();
        scene.add(fireflyGroup);
        for (let i = 0; i < 64; i++) {
            const m = new THREE.Mesh(fGeo, fMats[i % fMats.length]);
            // 후광
            const halo = new THREE.Mesh(new THREE.SphereGeometry(1.1, 8, 8),
                new THREE.MeshBasicMaterial({ color: fColors[i % fColors.length], transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false }));
            m.add(halo);
            m.userData = {
                rad: 14 + rng() * 16, h: 30 + rng() * 22, sp: 0.25 + rng() * 0.5,
                ph: rng() * Math.PI * 2, vAmp: 2 + rng() * 5, vSp: 0.6 + rng() * 1.2, wob: rng() * Math.PI * 2,
            };
            fireflyGroup.add(m);
            fireflies.push(m);
        }

        // 떨어지는 잎/꽃잎
        const leaves = [];
        const leafGeo = new THREE.BoxGeometry(0.9, 0.22, 0.9);
        const leafMats = [P.leafL, P.gold, P.pink, P.leaf, P.cyan].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 }));
        const leafGroup = new THREE.Group();
        scene.add(leafGroup);
        for (let i = 0; i < 46; i++) {
            const m = new THREE.Mesh(leafGeo, leafMats[i % leafMats.length]);
            m.userData = { x: -24 + rng() * 48, z: -24 + rng() * 48, top: 46 + rng() * 8, sp: 2.6 + rng() * 2.4, sway: 2 + rng() * 3.5, ph: rng() * Math.PI * 2 };
            leafGroup.add(m);
            leaves.push(m);
        }

        // 폭포 물방울 + 하단 안개
        const drops = [];
        const dropGeo = new THREE.BoxGeometry(0.7, 1.3, 0.7);
        const dropMat = new THREE.MeshBasicMaterial({ color: 0xd6f6ff });
        const mist = [];
        const mistGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
        const mistMat = new THREE.MeshBasicMaterial({ color: 0xd8f2ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false });
        const waterGroup = new THREE.Group();
        scene.add(waterGroup);
        for (const [lx, ly, lz] of falls) {
            const len = Math.hypot(lx, lz), ux = lx / len, uz = lz / len;
            for (let i = 0; i < 14; i++) {
                const m = new THREE.Mesh(dropGeo, dropMat);
                m.userData = { lx, ly, lz, ux, uz, ph: rng(), sp: 26 + rng() * 14 };
                waterGroup.add(m); drops.push(m);
            }
            for (let i = 0; i < 12; i++) {
                const m = new THREE.Mesh(mistGeo, mistMat);
                m.userData = { bx: lx + ux * 6, bz: lz + uz * 6, ph: rng() * Math.PI * 2, sp: 0.6 + rng() * 0.6 };
                waterGroup.add(m); mist.push(m);
            }
        }

        // 세계수 밑동을 밝히는 등불 후광들
        const lanternHalos = [];
        for (const [hx, hy, hz, c] of [[9.5, 12.5, 6.5, 0xffe4a8], [0, 42, 0, 0x7fffd0]]) {
            const h = new THREE.Mesh(new THREE.SphereGeometry(2.4, 12, 12),
                new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
            h.position.set(hx, hy, hz);
            scene.add(h); lanternHalos.push(h);
        }

        // ==========================================
        // 7. 시작 & 루프
        // ==========================================
        setTimeout(() => {
            const l = document.getElementById('loader');
            l.style.opacity = '0';
            l.style.visibility = 'hidden';
        }, 250);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // 반딧불이
            for (const m of fireflies) {
                const u = m.userData;
                const a = t * u.sp + u.ph;
                m.position.set(
                    Math.cos(a) * u.rad + Math.sin(t * 0.7 + u.wob) * 3,
                    u.h + Math.sin(t * u.vSp + u.ph) * u.vAmp,
                    Math.sin(a) * u.rad + Math.cos(t * 0.6 + u.wob) * 3);
                const tw = 0.55 + (Math.sin(t * 3 + u.ph) * 0.5 + 0.5) * 0.45;
                m.material.opacity = tw;
                m.scale.setScalar(0.7 + tw * 0.5);
            }
            // 낙엽
            for (const m of leaves) {
                const u = m.userData;
                const cyc = (t * u.sp / u.top + u.ph) % 1;
                m.position.set(
                    u.x + Math.sin(t * 1.1 + u.ph) * u.sway,
                    9 + u.top * (1 - cyc),
                    u.z + Math.cos(t * 0.8 + u.ph) * u.sway * 0.6);
                m.rotation.set(t * 1.8 + u.ph, t * 1.3, u.ph);
            }
            // 폭포 물방울
            for (const m of drops) {
                const u = m.userData;
                const cyc = (t * u.sp / 60 + u.ph) % 1;
                const depth = cyc * 44;
                m.position.set(u.lx + u.ux * depth * 0.14 + Math.sin(depth) * 0.5, u.ly - depth, u.lz + u.uz * depth * 0.14);
            }
            // 하단 안개
            for (const m of mist) {
                const u = m.userData;
                const cyc = (t * u.sp + u.ph) % (Math.PI * 2);
                const rise = (cyc / (Math.PI * 2));
                m.position.set(u.bx + Math.sin(cyc) * 3, -28 + rise * 8, u.bz + Math.cos(cyc * 0.7) * 3);
                m.material = mistMat;
                m.scale.setScalar(1 + rise * 1.6);
            }
            // 떠 있는 섬 흔들림
            for (const it of islets) {
                it.g.position.y = it.base.y + Math.sin(t * it.sp + it.ph) * it.amp;
                it.g.rotation.y = t * 0.12 + it.ph;
            }
            // 빛 맥동
            canopyLight.intensity = 1.5 + Math.sin(t * 1.6) * 0.35 + Math.sin(t * 4.1) * 0.12;
            goldLight.intensity = 1.05 + Math.sin(t * 2.3 + 1) * 0.3;
            lanternHalos[0].material.opacity = 0.18 + Math.sin(t * 5) * 0.06;
            lanternHalos[1].material.opacity = 0.2 + Math.sin(t * 1.6) * 0.08;
            stars.rotation.y = t * 0.006;

            controls.target.y = 24 + Math.sin(t * 0.8) * 1.2;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
