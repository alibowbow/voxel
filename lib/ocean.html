<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복셀 마스터피스: 산호초 바닷속</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: linear-gradient(#0a5f8e 0%, #084a72 50%, #032a44 100%);
            font-family: 'Noto Sans KR', sans-serif; user-select: none; }
        body::after { content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 38%, rgba(1, 15, 28, 0.5) 130%);
            pointer-events: none; z-index: 5; }
        #loader { position: absolute; inset: 0; background: #032a44; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; color: white;
            transition: opacity 1s ease, visibility 1s ease; }
        .cube-wrapper { perspective: 800px; margin-bottom: 30px; }
        .cube { width: 50px; height: 50px; background: #22c8b0;
            animation: flip 1.2s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 24px rgba(34, 200, 176, 0.75); border-radius: 4px; }
        @keyframes flip {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            50% { transform: rotateX(-180.1deg) rotateY(0deg); background: #ff8a5c; box-shadow: 0 0 24px rgba(255, 138, 92, 0.75); }
            100% { transform: rotateX(-180deg) rotateY(-179.9deg); } }
        #loader h1 { font-weight: 900; letter-spacing: 5px; font-size: 2rem; margin: 0; }
        #loader p { color: #7fb4cc; font-size: 1rem; margin-top: 10px; }
        #ui { position: absolute; bottom: 40px; left: 40px; background: rgba(3, 30, 48, 0.62);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px 35px; border-radius: 16px; border: 1px solid rgba(180, 240, 255, 0.2);
            color: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 10; pointer-events: none;
            max-width: 420px; opacity: 0; transform: translateY(20px);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.2s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .title { font-size: 32px; font-weight: 900; color: #22c8b0; letter-spacing: 1.4px; margin-bottom: 5px; line-height: 1.2; }
        .subtitle { font-size: 15px; color: #ff8a5c; font-weight: 700; margin-bottom: 20px; }
        .instructions { font-size: 13.5px; color: #d2ecf5; line-height: 1.8;
            background: rgba(0,0,0,0.26); padding: 12px 15px; border-radius: 8px; }
        .instructions span { color: #fff; font-weight: bold; }
    </style>
    <script type="importmap">
        { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
    </script>
</head>
<body>
    <div id="loader">
        <div class="cube-wrapper"><div class="cube"></div></div>
        <h1>복셀 조각 중...</h1>
        <p>산호초 사이로 물고기 떼를 풀어놓는 중입니다</p>
    </div>
    <div id="ui">
        <div class="title">산호초 바닷속</div>
        <div class="subtitle">바다거북 · 물고기 떼 · 피어오르는 물방울</div>
        <div class="instructions">
            <span>🖱️ 좌클릭:</span> 카메라 회전<br>
            <span>🖱️ 우클릭:</span> 화면 이동<br>
            <span>🖱️ 스크롤:</span> 화면 확대/축소
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VoxelBuilder, buildVoxelMesh } from './voxel-engine.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a5f8e);
        scene.fog = new THREE.FogExp2(0x0a5f8e, 0.0055);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(-64, 40, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 16, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 220;
        controls.minDistance = 20;
        controls.maxPolarAngle = Math.PI / 2 + 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;

        // 물속으로 스며드는 햇빛
        scene.add(new THREE.AmbientLight(0x7fd4e8, 0.55));
        scene.add(new THREE.HemisphereLight(0x9fe8ff, 0x0a3450, 0.8));
        const sunRay = new THREE.DirectionalLight(0xbdf5ff, 1.8);
        sunRay.position.set(-40, 120, 30);
        sunRay.castShadow = true;
        sunRay.shadow.mapSize.set(4096, 4096);
        const d = 110;
        sunRay.shadow.camera.left = -d; sunRay.shadow.camera.right = d;
        sunRay.shadow.camera.top = d; sunRay.shadow.camera.bottom = -d;
        sunRay.shadow.camera.near = 10; sunRay.shadow.camera.far = 380;
        sunRay.shadow.bias = -0.0005;
        scene.add(sunRay);
        const glow = new THREE.PointLight(0x22c8b0, 1.1, 70, 2);
        glow.position.set(10, 18, 8);
        scene.add(glow);

        const P = {
            sand: 0xd8c48e, sandD: 0xb8a26e, rock: 0x5c6470, rockD: 0x424956,
            coralPink: 0xff6b9d, coralOrange: 0xff8a5c, coralPurple: 0xa06bff,
            coralYellow: 0xffd166, brainCoral: 0xffb0c8, tube: 0x22c8b0,
            kelp: 0x2e8f5a, kelpL: 0x54c47e,
            turtle: 0x4a9e5c, turtleD: 0x2f7040, shell: 0x7a5c34, shellD: 0x5c421f, turtleSkin: 0x8fce9b,
            whale: 0x2a4a6e, whaleBelly: 0x9fb8cc,
            fish: 0xff8a3c, fishStripe: 0xffffff, starfish: 0xff5c8a, anemone: 0xd66bff,
        };

        const v = new VoxelBuilder();
        function mulberry32(seed) {
            return function () {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const rng = mulberry32(20260620);

        function seabed() {
            for (let x = -65; x <= 65; x++) {
                for (let z = -55; z <= 55; z++) {
                    const h = Math.floor(Math.sin(x * 0.11) * 1.6 + Math.cos(z * 0.09) * 1.6);
                    v.add(x, h, z, rng() > 0.8 ? P.sandD : P.sand);
                    v.add(x, h - 1, z, P.sandD);
                    if (rng() > 0.995) v.add(x, h + 1, z, 0xfff2e0); // 조개
                }
            }
            // 바위
            for (const [rx, rz, r] of [[-34, -20, 7], [30, 26, 6], [-20, 30, 5], [40, -18, 8]]) {
                v.sphere(rx, 2, rz, r, P.rock);
                v.sphere(rx + 3, 4, rz - 2, r * 0.6, P.rockD);
            }
        }

        function branchCoral(x, z, color, h) {
            v.line(x, 1, z, x, h, z, 1.2, color);
            v.line(x, h * 0.45, z, x - 4, h * 0.9, z - 2, 0.9, color);
            v.line(x, h * 0.5, z, x + 4, h + 1, z + 2, 0.9, color);
            v.line(x - 4, h * 0.9, z - 2, x - 6, h + 2, z - 1, 0.7, color);
            v.line(x + 4, h + 1, z + 2, x + 6, h + 4, z + 1, 0.7, color);
        }

        function reef() {
            branchCoral(-28, -8, P.coralPink, 10);
            branchCoral(-22, -14, P.coralOrange, 8);
            branchCoral(24, 12, P.coralPurple, 11);
            branchCoral(30, 6, P.coralPink, 7);
            branchCoral(-8, 28, P.coralOrange, 9);
            v.sphere(-32, 3, 2, 4.5, P.brainCoral); // 뇌산호
            v.sphere(18, 3, -22, 5, P.coralYellow);
            for (const [tx, tz] of [[10, 24], [13, 26], [11, 29], [15, 23]]) { // 관산호
                v.cylinderY(tx, 1, 6 + Math.floor(rng() * 4), tz, 1.2, P.tube);
            }
            for (const [ax, az] of [[-12, -26], [36, 30]]) { // 말미잘
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 5) {
                    v.line(ax, 1, az, ax + Math.cos(a) * 3, 6, az + Math.sin(a) * 3, 0.7, P.anemone);
                }
            }
            // 불가사리
            for (const [sx, sz] of [[0, -18], [-40, 16]]) {
                v.add(sx, 2, sz, P.starfish);
                v.add(sx + 1, 2, sz, P.starfish); v.add(sx - 1, 2, sz, P.starfish);
                v.add(sx, 2, sz + 1, P.starfish); v.add(sx, 2, sz - 1, P.starfish);
            }
            // 켈프 숲
            for (const [kx, kz] of [[-46, -30], [-43, -26], [-48, -24], [44, 34], [47, 30], [50, 36]]) {
                for (let y = 1; y < 22 + rng() * 8; y++) {
                    v.add(kx + Math.sin(y * 0.4) * 1.6, y, kz + Math.cos(y * 0.3) * 1.2, y % 3 ? P.kelp : P.kelpL);
                }
            }
        }

        function seaTurtle() { // 유영 중인 바다거북
            const cx = 4, cy = 22, cz = -4;
            v.ellipsoid(cx, cy, cz, 7, 3, 6, P.shell);
            v.ellipsoid(cx, cy - 1, cz, 6, 2, 5, P.turtleSkin);
            for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++)
                if ((i + j) % 2 === 0) v.box(cx + i * 3 - 1, cy + 2, cz + j * 3 - 1, cx + i * 3 + 1, cy + 3, cz + j * 3 + 1, P.shellD);
            v.sphere(cx + 8, cy, cz, 2.4, P.turtle); // 머리
            v.add(cx + 9, cy + 1, cz + 1, 0x111111); v.add(cx + 9, cy + 1, cz - 1, 0x111111);
            v.line(cx + 4, cy - 1, cz + 5, cx + 9, cy - 2, cz + 9, 1.4, P.turtle);  // 앞지느러미
            v.line(cx + 4, cy - 1, cz - 5, cx + 9, cy - 2, cz - 9, 1.4, P.turtle);
            v.line(cx - 5, cy - 1, cz + 4, cx - 8, cy - 2, cz + 7, 1.1, P.turtleD); // 뒷지느러미
            v.line(cx - 5, cy - 1, cz - 4, cx - 8, cy - 2, cz - 7, 1.1, P.turtleD);
        }

        function farWhale() { // 원경의 고래
            const wx = -30, wy = 42, wz = -60;
            v.ellipsoid(wx, wy, wz, 16, 6, 5, P.whale);
            v.ellipsoid(wx + 2, wy - 3, wz, 12, 3, 4, P.whaleBelly);
            v.line(wx - 15, wy + 1, wz, wx - 22, wy + 5, wz, 2, P.whale); // 꼬리
            v.box(wx - 25, wy + 4, wz - 5, wx - 20, wy + 6, wz + 5, P.whale);
            v.line(wx + 6, wy - 4, wz + 4, wx + 11, wy - 7, wz + 7, 1.4, P.whale); // 가슴지느러미
            v.add(wx + 13, wy + 2, wz + 2, 0x111111);
        }

        seabed();
        reef();
        seaTurtle();
        farWhale();

        // 물고기 떼 (애니메이션)
        const fishGroup = new THREE.Group();
        scene.add(fishGroup);
        const fishGeo = new THREE.BoxGeometry(2.4, 1, 0.8);
        const tailGeo = new THREE.BoxGeometry(0.8, 0.8, 0.3);
        const fishMat = new THREE.MeshStandardMaterial({ color: P.fish });
        const stripeMat = new THREE.MeshStandardMaterial({ color: P.fishStripe });
        const fishes = [];
        for (let i = 0; i < 26; i++) {
            const f = new THREE.Group();
            const body = new THREE.Mesh(fishGeo, fishMat);
            const stripe = new THREE.Mesh(tailGeo, stripeMat);
            stripe.position.x = 0.4;
            const tail = new THREE.Mesh(tailGeo, fishMat);
            tail.position.x = -1.5;
            f.add(body, stripe, tail);
            f.userData = { r: 14 + rng() * 10, h: 20 + rng() * 14, phase: rng() * Math.PI * 2, speed: 0.5 + rng() * 0.3, bob: rng() * 2 };
            fishGroup.add(f);
            fishes.push(f);
        }

        // 물방울 (애니메이션)
        const bubbleGroup = new THREE.Group();
        scene.add(bubbleGroup);
        const bubbleGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const bubbleMat = new THREE.MeshStandardMaterial({ color: 0xcdf4ff, transparent: true, opacity: 0.45 });
        const bubbles = [];
        for (let i = 0; i < 34; i++) {
            const b = new THREE.Mesh(bubbleGeo, bubbleMat);
            b.userData = { x: -45 + rng() * 90, z: -40 + rng() * 80, speed: 4 + rng() * 5, phase: rng() * Math.PI * 2, top: 55 + rng() * 15 };
            bubbleGroup.add(b);
            bubbles.push(b);
        }

        scene.add(buildVoxelMesh(THREE, v, { size: 0.95, roughness: 0.8, metalness: 0.06 }));
        setTimeout(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
        }, 200);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            for (const f of fishes) {
                const u = f.userData;
                const a = t * u.speed + u.phase;
                f.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 2 + u.phase) * u.bob, Math.sin(a) * u.r);
                f.rotation.y = -a - Math.PI / 2;
            }
            for (const b of bubbles) {
                const u = b.userData;
                const cycle = (t * u.speed / u.top + u.phase) % 1;
                b.position.set(u.x + Math.sin(t * 2 + u.phase) * 1.4, 2 + u.top * cycle, u.z);
                const s = 0.6 + cycle * 0.9;
                b.scale.setScalar(s);
                b.material = bubbleMat;
            }
            glow.intensity = 1.0 + Math.sin(t * 2.6) * 0.25;
            controls.target.y = 16 + Math.sin(t * 1.0) * 1.4;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
