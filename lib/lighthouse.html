<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복셀 마스터피스: 은하수 아래 등대</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: linear-gradient(#050816 0%, #0a1230 50%, #122048 100%);
            font-family: 'Noto Sans KR', sans-serif; user-select: none; }
        body::after { content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 42%, rgba(2, 4, 14, 0.55) 130%);
            pointer-events: none; z-index: 5; }
        #loader { position: absolute; inset: 0; background: #050816; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999; color: white;
            transition: opacity 1.2s ease, visibility 1.2s ease; }
        .cube-wrapper { perspective: 800px; margin-bottom: 30px; }
        .cube { width: 50px; height: 50px; background: #ffe7a0;
            animation: flip 1.2s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 28px rgba(255, 231, 160, 0.8); border-radius: 4px; }
        @keyframes flip {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            50% { transform: rotateX(-180.1deg) rotateY(0deg); background: #6fe8ff; box-shadow: 0 0 28px rgba(111, 232, 255, 0.8); }
            100% { transform: rotateX(-180deg) rotateY(-179.9deg); } }
        #loader h1 { font-weight: 900; letter-spacing: 5px; font-size: 2rem; margin: 0; }
        #loader p { color: #8a9ccc; font-size: 1rem; margin-top: 10px; }
        #ui { position: absolute; bottom: 40px; left: 40px; background: rgba(6, 10, 30, 0.58);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px 35px; border-radius: 16px; border: 1px solid rgba(190, 210, 255, 0.2);
            color: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.45); z-index: 10; pointer-events: none;
            max-width: 440px; opacity: 0; transform: translateY(20px);
            animation: slideUp 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.4s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .title { font-size: 32px; font-weight: 900; color: #ffe7a0; letter-spacing: 1.4px; margin-bottom: 5px; line-height: 1.2; }
        .subtitle { font-size: 15px; color: #6fe8ff; font-weight: 700; margin-bottom: 20px; }
        .instructions { font-size: 13.5px; color: #dfe6f8; line-height: 1.8;
            background: rgba(0,0,0,0.28); padding: 12px 15px; border-radius: 8px; }
        .instructions span { color: #fff; font-weight: bold; }
    </style>
    <script type="importmap">
        { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
    </script>
</head>
<body>
    <div id="loader">
        <div class="cube-wrapper"><div class="cube"></div></div>
        <h1>복셀 조각 중...</h1>
        <p>은하수 아래 등대에 불을 밝히고 있습니다</p>
    </div>
    <div id="ui">
        <div class="title">은하수 아래 등대</div>
        <div class="subtitle">회전하는 등대 불빛 · 출렁이는 바다 · 야광 플랑크톤 · 별똥별</div>
        <div class="instructions">
            <span>🖱️ 좌클릭:</span> 카메라 회전<br>
            <span>🖱️ 우클릭:</span> 화면 이동<br>
            <span>🖱️ 스크롤:</span> 화면 확대/축소
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VoxelBuilder, buildVoxelMesh } from './voxel-engine.js';

        // ==========================================
        // 1. 씬 · 렌더러 · 카메라 · 조명 (달 없는 맑은 밤)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070b1e);
        scene.fog = new THREE.Fog(0x0b1330, 85, 185);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 1600);
        camera.position.set(-72, 22, 82);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 17, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 230;
        controls.minDistance = 26;
        controls.maxPolarAngle = Math.PI / 2 - 0.03;   // 수면 아래로는 내려가지 않게
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.55;

        scene.add(new THREE.AmbientLight(0x3a4a7a, 0.7));
        scene.add(new THREE.HemisphereLight(0x5a70b8, 0x0c1426, 0.7));
        const starlight = new THREE.DirectionalLight(0xb4c4ff, 1.05);
        starlight.position.set(-50, 90, 60);
        starlight.castShadow = true;
        starlight.shadow.mapSize.set(4096, 4096);
        const d = 70;
        starlight.shadow.camera.left = -d; starlight.shadow.camera.right = d;
        starlight.shadow.camera.top = d; starlight.shadow.camera.bottom = -d;
        starlight.shadow.camera.near = 10; starlight.shadow.camera.far = 300;
        starlight.shadow.bias = -0.0005;
        scene.add(starlight);

        function mulberry32(seed) {
            return function () {
                let t = seed += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const rng = mulberry32(20260923);
        const gauss = () => {
            const u = Math.max(1e-6, rng()), w = rng();
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * w);
        };

        function softSprite() {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const g = c.getContext('2d');
            const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            gr.addColorStop(0, 'rgba(255,255,255,1)');
            gr.addColorStop(0.22, 'rgba(255,255,255,0.85)');
            gr.addColorStop(0.5, 'rgba(255,255,255,0.22)');
            gr.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = gr;
            g.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }
        const sprite = softSprite();
        // 부드럽게 번지는 빛 (가법 혼합 스프라이트)
        function glow(color, size, opacity) {
            const s = new THREE.Sprite(new THREE.SpriteMaterial({
                map: sprite, color, transparent: true, opacity,
                blending: THREE.AdditiveBlending, depthWrite: false }));
            s.scale.setScalar(size);
            return s;
        }

        // ==========================================
        // 2. 팔레트
        // ==========================================
        const P = {
            rock: 0x56607a, rockD: 0x3f475e, rockL: 0x6f7a94, rockMoss: 0x44604e,
            sand: 0xb8a882, sandD: 0x9a8c6c,
            grass: 0x3f6a4c, grassL: 0x557f5c, grassD: 0x30543c,
            red: 0xc8323a, redD: 0x9e2530, white: 0xeef0f4, whiteD: 0xcfd4de,
            iron: 0x2a2f3a, glass: 0xfff2b8, gold: 0xffd66b,
            wall: 0xe6e0d2, roof: 0x34405a, roofD: 0x28324a, wood: 0x6b4a30, woodD: 0x4e3522,
            window: 0xffc870, stone: 0x8a8f9c,
            flowerW: 0xf0f4ff, flowerB: 0x9ab8ff,
        };
        const pick = (...cs) => cs[Math.floor(rng() * cs.length)];

        // ==========================================
        // 3. 섬 (계단식 절벽)
        // ==========================================
        const v = new VoxelBuilder();
        const islandR = (a) => 13 + Math.sin(a * 3) * 2.2 + Math.cos(a * 5 + 1) * 1.3;
        const topAt = {};   // "x,z" → 윗면 높이

        function island() {
            for (let x = -19; x <= 19; x++)
            for (let z = -19; z <= 19; z++) {
                const dd = Math.hypot(x, z), a = Math.atan2(z, x), r = islandR(a);
                if (dd > r) continue;
                const h = Math.min(11, Math.floor((r - dd) * 2.4));
                topAt[x + ',' + z] = h;
                for (let y = -4; y <= h; y++) {
                    let c;
                    if (y === h) {
                        if (h <= 1) c = pick(P.sand, P.sandD);
                        else if (h < 11) c = rng() < 0.55 ? P.rockMoss : pick(P.grassD, P.rockL);
                        else c = rng() < 0.2 ? P.grassL : (rng() < 0.2 ? P.grassD : P.grass);
                    } else {
                        const band = ((y + 20) % 3 === 0);
                        c = band ? P.rockD : (rng() < 0.25 ? P.rockL : P.rock);
                    }
                    v.add(x, y, z, c);
                }
                // 고원 위 꽃과 풀
                if (h === 11 && rng() < 0.07) v.add(x, 12, z, rng() < 0.6 ? P.flowerW : P.flowerB);
            }
            // 해안 바위
            for (let i = 0; i < 16; i++) {
                const a = rng() * Math.PI * 2, rr = islandR(a) + 1 + rng() * 3;
                v.sphere(Math.round(Math.cos(a) * rr), 0, Math.round(Math.sin(a) * rr), 1 + rng() * 1.4, pick(P.rock, P.rockD, P.rockL));
            }
        }

        // ==========================================
        // 4. 등대
        // ==========================================
        const LX = 2, LZ = -3, LB = 12;
        const LANTERN_Y = LB + 24.5;
        function lighthouse() {
            v.cylinderY(LX, LB, LB + 1, LZ, 4.4, P.stone);                  // 받침돌
            for (let y = LB + 2; y <= LB + 21; y++) {                        // 줄무늬 몸통 (위로 갈수록 가늘게)
                const t = (y - LB - 2) / 19;
                const r = 3.5 - t * 1.1;
                const stripe = Math.floor((y - LB - 2) / 4) % 2 === 0;
                v.cylinderY(LX, y, y, LZ, r, stripe ? (y % 2 ? P.red : P.redD) : (y % 2 ? P.white : P.whiteD));
            }
            // 작은 창문 (나선 배치)
            for (let i = 0; i < 4; i++) {
                const y = LB + 5 + i * 4, a = i * 1.7;
                const r = 3.5 - ((y - LB - 2) / 19) * 1.1;
                v.add(LX + Math.cos(a) * r, y, LZ + Math.sin(a) * r, P.window);
            }
            v.box(LX - 1, LB + 2, LZ + 3, LX + 1, LB + 5, LZ + 4, P.woodD);  // 문
            // 발코니 + 난간
            v.cylinderY(LX, LB + 22, LB + 22, LZ, 3.9, P.iron);
            v.ringY(LX, LB + 23, LZ, 3.6, 0.45, P.iron);
            // 등롯실 (유리 + 기둥)
            v.cylinderY(LX, LB + 23, LB + 26, LZ, 2.2, P.glass);
            for (const [ox, oz] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) v.box(LX + ox, LB + 23, LZ + oz, LX + ox, LB + 26, LZ + oz, P.iron);
            // 돔 지붕 + 첨탑
            v.cylinderY(LX, LB + 27, LB + 27, LZ, 3, P.red);
            v.cylinderY(LX, LB + 28, LB + 28, LZ, 2, P.redD);
            v.cylinderY(LX, LB + 29, LB + 29, LZ, 1, P.red);
            v.box(LX, LB + 30, LZ, LX, LB + 31, LZ, P.iron);
            v.add(LX, LB + 32, LZ, P.gold);
        }

        // ==========================================
        // 5. 관리인 오두막 · 돌길 · 부두
        // ==========================================
        const CX = -7, CZ = 5, CY = 12;
        function cottage() {
            v.box(CX - 4, CY, CZ - 3, CX + 4, CY + 4, CZ + 3, P.wall);
            for (let i = 0; i <= 3; i++)                                        // 박공 지붕
                v.box(CX - 5, CY + 5 + i, CZ - 4 + i, CX + 5, CY + 5 + i, CZ + 4 - i, i % 2 ? P.roofD : P.roof);
            v.box(CX - 4, CY + 5, CZ - 3, CX - 4, CY + 7, CZ + 3, P.wall);    // 박공 벽
            v.box(CX + 4, CY + 5, CZ - 3, CX + 4, CY + 7, CZ + 3, P.wall);
            v.box(CX - 3, CY + 1, CZ + 3, CX - 2, CY + 2, CZ + 3, P.window); // 따뜻한 창
            v.box(CX + 2, CY + 1, CZ + 3, CX + 3, CY + 2, CZ + 3, P.window);
            v.box(CX - 4, CY + 1, CZ - 1, CX - 4, CY + 2, CZ, P.window);
            v.box(CX, CY, CZ + 3, CX, CY + 2, CZ + 3, P.woodD);               // 문
            v.box(CX + 2, CY + 6, CZ - 2, CX + 3, CY + 10, CZ - 1, P.stone);  // 굴뚝
            // 돌길 (오두막 → 등대)
            v.line(CX + 1, CY - 1 + 0.4, CZ + 4, LX - 1, LB - 1 + 0.4, LZ + 5, 0.5, P.stone);
            v.line(CX + 2, CY - 1 + 0.4, CZ + 4, LX, LB - 1 + 0.4, LZ + 5, 0.5, P.whiteD);
            // 빨랫줄 기둥 + 울타리
            for (let x = CX - 6; x <= CX + 6; x += 3) v.box(x, 12, CZ + 7, x, 13, CZ + 7, P.wood);
            v.box(CX - 6, 13, CZ + 7, CX + 6, 13, CZ + 7, P.woodD);
        }

        function dock() {
            // 남쪽 해안에서 바다로 뻗은 나무 부두
            for (let z = 11; z <= 24; z++) {
                v.box(-1, 2, z, 1, 2, z, z % 2 ? P.wood : P.woodD);
                if (z % 4 === 0) { v.box(-2, -3, z, -2, 2, z, P.woodD); v.box(2, -3, z, 2, 2, z, P.woodD); }
            }
            // 부두 끝 가로등
            v.box(1, 3, 24, 1, 8, 24, P.iron);
            v.box(0, 9, 23, 2, 10, 25, P.glass);
            v.box(0, 11, 23, 2, 11, 25, P.iron);
            // 해안 → 부두 계단
            for (let s = 0; s < 9; s++) v.box(-1, 3 + s, 10 - s, 1, 3 + s, 10 - s, P.stone);
        }

        island();
        lighthouse();
        cottage();
        dock();
        scene.add(buildVoxelMesh(THREE, v, { size: 0.96, roughness: 0.86, metalness: 0.05 }));

        // 등불/창문 조명
        const lampLight = new THREE.PointLight(0xffd68a, 3.2, 90, 1.6);
        lampLight.position.set(LX, LANTERN_Y, LZ);
        scene.add(lampLight);
        const homeLight = new THREE.PointLight(0xffb45c, 1.6, 22, 2);
        homeLight.position.set(CX, CY + 2, CZ + 5);
        scene.add(homeLight);
        const homeGlow = glow(0xffb45c, 10, 0.55);
        homeGlow.position.set(CX, CY + 2, CZ + 4);
        scene.add(homeGlow);
        const dockLight = new THREE.PointLight(0xffd68a, 1.4, 26, 2);
        dockLight.position.set(1, 9, 26);
        scene.add(dockLight);

        // ==========================================
        // 6. 살아 있는 복셀 바다 (InstancedMesh, 매 프레임 물결)
        // ==========================================
        const OR = 74;
        const oceanCells = [];
        for (let x = -OR; x <= OR; x++)
        for (let z = -OR; z <= OR; z++) {
            const dd = Math.hypot(x, z);
            if (dd > OR) continue;
            if (dd < islandR(Math.atan2(z, x)) - 1.5) continue;         // 섬 아래는 생략
            oceanCells.push([x, z, dd, islandR(Math.atan2(z, x))]);
        }
        const ocean = new THREE.InstancedMesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ roughness: 0.28, metalness: 0.15 }),
            oceanCells.length);
        ocean.receiveShadow = true;
        ocean.castShadow = false;
        ocean.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(ocean);
        const farSea = new THREE.Mesh(new THREE.RingGeometry(OR - 2, 900, 96, 1),
            new THREE.MeshStandardMaterial({ color: 0x0e2c52, roughness: 0.3, metalness: 0.15 }));
        farSea.rotation.x = -Math.PI / 2;
        farSea.position.y = -0.55;
        farSea.receiveShadow = true;
        scene.add(farSea);

        const waveH = (x, z, t) =>
            Math.sin(x * 0.18 + t * 1.1) * 0.55 +
            Math.sin(z * 0.23 - t * 0.9) * 0.45 +
            Math.sin((x + z) * 0.11 + t * 0.7) * 0.35;

        const cDeep = new THREE.Color(0x0a2440), cMid = new THREE.Color(0x174a78),
              cCrest = new THREE.Color(0x4d95c4), cFoam = new THREE.Color(0xd6ecff),
              cGlow = new THREE.Color(0x4ff5e0);
        const tmpC = new THREE.Color();
        const dummy = new THREE.Object3D();
        // 셀마다 고정된 야광 위상 (플랑크톤이 제각각 깜빡이도록)
        const glowPhase = oceanCells.map(() => rng() * Math.PI * 2);

        function updateOcean(t) {
            for (let i = 0; i < oceanCells.length; i++) {
                const [x, z, dd, shore] = oceanCells[i];
                const h = waveH(x, z, t);
                dummy.position.set(x, h - 0.6, z);
                dummy.updateMatrix();
                ocean.setMatrixAt(i, dummy.matrix);

                const k = (h + 1.35) / 2.7;                                  // 0~1
                if (k < 0.5) tmpC.lerpColors(cDeep, cMid, k * 2);
                else tmpC.lerpColors(cMid, cCrest, (k - 0.5) * 2);
                if (dd < shore + 2.5 && h > 0.35) tmpC.lerp(cFoam, 0.75);      // 해안 물거품
                else if (dd < shore + 14 && h > 0.7) {                          // 파도 마루의 야광 플랑크톤
                    const p = Math.sin(t * 2.4 + glowPhase[i]) * 0.5 + 0.5;
                    tmpC.lerp(cGlow, 0.25 + p * 0.55);
                }
                ocean.setColorAt(i, tmpC);
            }
            ocean.instanceMatrix.needsUpdate = true;
            ocean.instanceColor.needsUpdate = true;
        }

        // ==========================================
        // 7. 회전하는 등대 빛줄기
        // ==========================================
        const beamPivot = new THREE.Group();
        beamPivot.position.set(LX, LANTERN_Y, LZ);
        scene.add(beamPivot);
        const beamTilt = new THREE.Group();
        beamTilt.rotation.z = -0.07;                                        // 살짝 바다 쪽으로
        beamPivot.add(beamTilt);
        function beamCone(len, radius, opacity) {
            const g = new THREE.ConeGeometry(radius, len, 40, 1, true);
            g.translate(0, -len / 2, 0);                                     // 꼭짓점을 원점으로
            g.rotateZ(Math.PI / 2);                                          // +X 방향으로 뻗게
            // 꼭짓점(등롯실)에서 밝고 끝으로 갈수록 어둠에 녹아드는 그라데이션
            const pos = g.attributes.position, cols = [];
            for (let i = 0; i < pos.count; i++) {
                const f = Math.pow(Math.max(0, 1 - pos.getX(i) / len), 1.6);
                cols.push(1.0 * f, 0.94 * f, 0.72 * f);
            }
            g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
            return new THREE.Mesh(g, new THREE.MeshBasicMaterial({
                vertexColors: true, transparent: true, opacity, blending: THREE.AdditiveBlending,
                depthWrite: false, side: THREE.DoubleSide, fog: false }));
        }
        for (const dir of [0, Math.PI]) {
            const arm = new THREE.Group();
            arm.rotation.y = dir;
            arm.add(beamCone(105, 10, 0.06));
            arm.add(beamCone(90, 4.6, 0.11));
            arm.add(beamCone(65, 1.8, 0.22));
            beamTilt.add(arm);
        }
        const lanternGlow = glow(0xffe9a8, 22, 0.9);
        lanternGlow.position.set(LX, LANTERN_Y, LZ);
        scene.add(lanternGlow);
        const dockGlow = glow(0xffd890, 9, 0.85);
        dockGlow.position.set(1, 10, 24);
        scene.add(dockGlow);

        // ==========================================
        // 8. 섬을 도는 돛단배
        // ==========================================
        const bv = new VoxelBuilder();
        for (let x = -4; x <= 4; x++) {                                     // 선체 (앞뒤가 좁아짐)
            const half = Math.abs(x) >= 4 ? 0 : (Math.abs(x) >= 3 ? 1 : 2);
            bv.box(x, 0, -half, x, 1, half, x % 2 ? P.wood : P.woodD);
        }
        bv.box(-3, 2, -1, 3, 2, 1, P.whiteD);                                // 갑판
        bv.box(0, 3, 0, 0, 12, 0, P.woodD);                                  // 돛대
        for (let y = 4; y <= 11; y++) {                                      // 삼각 돛
            const w = Math.round((11 - y) * 0.6);
            bv.box(1, y, 0, 1 + w, y, 0, P.white);
        }
        bv.add(0, 13, 0, P.glass);                                           // 돛대 등불
        const boatMesh = buildVoxelMesh(THREE, bv, { size: 0.95, roughness: 0.8 });
        const boat = new THREE.Group();
        boat.add(boatMesh);
        scene.add(boat);
        const boatGlow = glow(0xffd890, 6, 0.9);
        boatGlow.position.set(0, 13, 0);
        boat.add(boatGlow);

        // ==========================================
        // 9. 은하수 · 성운 먼지 · 별똥별
        // ==========================================
        // 은하수 띠: 기울어진 대원(大圓)을 따라 가우시안 분포
        // 띠의 법선을 고도 58°로 기울여, 은하수가 수평선 위 낮은 하늘(최대 ~32°)을 아치로 지나게
        const bandN = new THREE.Vector3(Math.cos(1.0) * Math.cos(0.6), Math.sin(1.0), Math.cos(1.0) * Math.sin(0.6)).normalize();
        const bandU = new THREE.Vector3().crossVectors(bandN, new THREE.Vector3(0, 1, 0)).normalize();
        const bandV = new THREE.Vector3().crossVectors(bandN, bandU).normalize();
        const SKY = 480;
        function starCloud(count, spread, sizeJit, palette) {
            const pos = [], col = [];
            const c = new THREE.Color();
            let n = 0;
            while (n < count) {
                let dir;
                if (spread === null) {                                        // 전천 균일
                    const a = rng() * Math.PI * 2, b = Math.acos(rng() * 2 - 1);
                    dir = new THREE.Vector3(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a));
                } else {
                    const th = rng() * Math.PI * 2;
                    dir = bandU.clone().multiplyScalar(Math.cos(th))
                        .add(bandV.clone().multiplyScalar(Math.sin(th)))
                        .add(bandN.clone().multiplyScalar(gauss() * spread)).normalize();
                }
                if (dir.y < -0.05) continue;                                  // 수평선 아래 생략
                pos.push(dir.x * SKY, dir.y * SKY, dir.z * SKY);
                c.setHex(palette[Math.floor(rng() * palette.length)]);
                const b = 0.55 + rng() * sizeJit;
                col.push(c.r * b, c.g * b, c.b * b);
                n++;
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
            return g;
        }
        const starMat = (size, opacity) => new THREE.PointsMaterial({
            size, map: sprite, vertexColors: true, transparent: true, opacity,
            depthWrite: false, blending: THREE.AdditiveBlending, fog: false, sizeAttenuation: false });   // 픽셀 단위

        const sky = new THREE.Group();
        scene.add(sky);
        sky.add(new THREE.Points(starCloud(1500, null, 0.45, [0xffffff, 0xdfe6ff, 0xfff1d6]), starMat(2.6, 0.85)));
        sky.add(new THREE.Points(starCloud(5200, 0.075, 0.45, [0xffffff, 0xe8ecff, 0xffe8cc, 0xcfe0ff]), starMat(2.2, 0.95)));
        sky.add(new THREE.Points(starCloud(180, 0.06, 0.3, [0xffffff, 0xfff0d0, 0xd8e4ff]), starMat(5, 1)));
        sky.add(new THREE.Points(starCloud(900, 0.1, 0.2, [0x7a5cff, 0x4f7fff, 0xff6fb5, 0x5fd8ff, 0xffb070]), starMat(80, 0.07)));
        sky.add(new THREE.Points(starCloud(420, 0.04, 0.2, [0xfff0d8, 0xffd9b0, 0xe8d8ff]), starMat(60, 0.08)));  // 은하 중심 빛무리

        // 별똥별
        const meteors = [];
        for (let i = 0; i < 3; i++) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 26),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
            m.userData = { life: 0, vel: new THREE.Vector3(), wait: 2 + i * 4 + rng() * 4 };
            scene.add(m);
            meteors.push(m);
        }
        function updateMeteors(dt) {
            for (const m of meteors) {
                const u = m.userData;
                if (u.life <= 0) {
                    u.wait -= dt;
                    m.material.opacity = 0;
                    if (u.wait <= 0) {
                        const a = rng() * Math.PI * 2;
                        m.position.set(Math.cos(a) * 200, 150 + rng() * 60, Math.sin(a) * 200);
                        u.vel.set(-Math.cos(a) * 60 + (rng() - 0.5) * 60, -26 - rng() * 20, -Math.sin(a) * 60 + (rng() - 0.5) * 60);
                        u.life = 1.3;
                        u.wait = 5 + rng() * 7;
                    }
                    continue;
                }
                u.life -= dt;
                m.position.addScaledVector(u.vel, dt);
                m.lookAt(m.position.clone().add(u.vel));
                m.material.opacity = Math.max(0, Math.sin((u.life / 1.3) * Math.PI)) * 0.9;
            }
        }

        // ==========================================
        // 10. 굴뚝 연기
        // ==========================================
        const smoke = [];
        const smokeGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
        for (let i = 0; i < 16; i++) {
            const m = new THREE.Mesh(smokeGeo, new THREE.MeshStandardMaterial({ color: 0x9aa4bc, transparent: true, opacity: 0.4, depthWrite: false }));
            m.userData = { ph: i / 16 };
            scene.add(m);
            smoke.push(m);
        }

        // ==========================================
        // 11. 시작 & 루프
        // ==========================================
        setTimeout(() => {
            const l = document.getElementById('loader');
            l.style.opacity = '0';
            l.style.visibility = 'hidden';
        }, 250);

        const clock = new THREE.Clock();
        let last = 0;
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const dt = Math.min(0.05, t - last);
            last = t;

            updateOcean(t);

            // 등대 빛
            beamPivot.rotation.y = t * 0.75;
            lanternGlow.material.opacity = 0.82 + Math.sin(t * 3) * 0.1;
            lampLight.intensity = 3 + Math.sin(t * 2.2) * 0.25;
            homeLight.intensity = 1.5 + Math.sin(t * 7.3) * 0.12 + Math.sin(t * 13.1) * 0.08;   // 난롯불 일렁임

            // 돛단배: 섬 주위를 천천히 돌며 파도에 흔들림
            const ba = t * 0.07 + 1.2, br = 33;
            const bx = Math.cos(ba) * br, bz = Math.sin(ba) * br;
            const bh = waveH(bx, bz, t);
            boat.position.set(bx, bh + 0.3, bz);
            boat.rotation.y = -ba;                                           // 진행 방향으로
            boat.rotation.z = (waveH(bx + 2, bz, t) - waveH(bx - 2, bz, t)) * 0.2;
            boat.rotation.x = (waveH(bx, bz + 2, t) - waveH(bx, bz - 2, t)) * 0.2;

            // 굴뚝 연기
            for (const m of smoke) {
                const c = (t * 0.12 + m.userData.ph) % 1;
                m.position.set(CX + 2.5 + Math.sin(t + m.userData.ph * 9) * 0.8 + c * 5, CY + 11 + c * 12, CZ - 1.5 + c * 2);
                m.scale.setScalar(0.5 + c * 2.2);
                m.material.opacity = 0.42 * (1 - c);
            }

            updateMeteors(dt);
            sky.rotation.y = t * 0.004;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
