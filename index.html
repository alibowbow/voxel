<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #0d1b2a;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        /* Pixel grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 1;
            padding: 60px 40px 40px;
            text-align: center;
        }

        .logo-cube {
            display: inline-block;
            width: 48px;
            height: 48px;
            background: #ff1155;
            border-radius: 6px;
            box-shadow: 0 0 24px rgba(255,17,85,0.7);
            animation: pulse 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 20px rgba(255,17,85,0.5); transform: scale(1); }
            to   { box-shadow: 0 0 40px rgba(255,17,85,0.9); transform: scale(1.08); }
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff1155, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        header p {
            font-size: 1rem;
            color: #888;
            letter-spacing: 1px;
        }

        /* Gallery grid */
        main {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 40px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }

        /* Card — accent colour is supplied per-card via the --accent variable */
        .card {
            --accent: #ff1155;
            --cta: #00ffff;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: color-mix(in srgb, var(--accent) 60%, transparent);
            box-shadow: 0 20px 50px color-mix(in srgb, var(--accent) 20%, transparent);
        }

        .card-preview {
            width: 100%;
            aspect-ratio: 16/10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffcca8;
            position: relative;
            overflow: hidden;
        }

        /* Icon fallback preview for scenes without custom art */
        .preview-default {
            font-size: 64px;
            line-height: 1;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
        }

        .card-preview .preview-label {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00ffff;
            text-transform: uppercase;
        }

        .card-info {
            padding: 20px 22px 22px;
        }

        .card-info .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .card-info h2 {
            font-size: 1.25rem;
            font-weight: 900;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .card-info p {
            font-size: 0.875rem;
            color: #aaa;
            line-height: 1.6;
        }

        .card-info .cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--cta);
            letter-spacing: 0.5px;
        }

        .cta-arrow {
            display: inline-block;
            transition: transform 0.2s;
        }
        .card:hover .cta-arrow { transform: translateX(4px); }

        /* "Coming soon" placeholder card */
        .card-placeholder {
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 30px;
            gap: 12px;
            color: #444;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-placeholder .plus {
            font-size: 2.5rem;
            line-height: 1;
            color: #333;
        }

        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px;
            font-size: 0.8rem;
            color: #444;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-cube"></div>
        <h1>Voxel Gallery</h1>
        <p>Procedural 3D voxel art — built with Three.js</p>
    </header>

    <!-- Cards are rendered from the scene manifest (scenes.js) -->
    <main id="gallery"></main>

    <footer>
        &copy; 2026 Voxel Gallery &mdash; Three.js Procedural Art
    </footer>

    <script src="scenes.js"></script>
    <script>
        (function () {
            const gallery = document.getElementById('gallery');
            const scenes = window.VOXEL_SCENES || [];

            const previewFor = (s) =>
                s.preview || `<div class="preview-default">${s.icon || '🧊'}</div>`;

            const cardHTML = (s) => `
                <a class="card" href="${s.file}" style="--accent:${s.accent || '#ff1155'}; --cta:${s.cta || s.accent || '#00ffff'};">
                    <div class="card-preview" style="background:${s.gradient || '#ffcca8'};">
                        ${previewFor(s)}
                        <div class="preview-label">${s.badge || 'Interactive 3D'}</div>
                    </div>
                    <div class="card-info">
                        <div class="tag">Voxel Scene #${s.index}</div>
                        <h2>${s.title}</h2>
                        <p>${s.desc}</p>
                        <span class="cta">Open Scene <span class="cta-arrow">→</span></span>
                    </div>
                </a>`;

            const placeholder =
                `<div class="card-placeholder"><span class="plus">+</span><span>Coming Soon</span></div>`;

            gallery.innerHTML = scenes.map(cardHTML).join('') + placeholder;
        })();
    </script>

</body>
</html>
